<text x="52" y="276" fill="#c2ff8a" xml:space="preserve">PS&gt; cwm import verify ...</text>
<text x="52" y="310" fill="#b6c6b5" xml:space="preserve">{</text>
<text x="52" y="344" fill="#f5f8f3" xml:space="preserve">  "status": "verified",</text>
<text x="52" y="378" fill="#f5f8f3" xml:space="preserve">  "deployed_bytes_match": true</text>
