<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">An independently checked portable recovery</title><desc id="desc">Abbreviated commands and selected JSON from a real synthetic packaged run: export verified, import verified, deployed bytes match, project state equivalent. The source remained unchanged.</desc><rect x="1" y="1" width="1198" height="628" rx="16" fill="#0b1110" stroke="#314232"/><path d="M1 59H1199" stroke="#314232"/><g fill="#657b65"><circle cx="52" cy="31" r="4"/><circle cx="68" cy="31" r="4"/><circle cx="84" cy="31" r="4"/></g><text x="112" y="36" fill="#b6c6b5" font-family="Arial,Helvetica,sans-serif" font-size="14">SYNTHETIC WORKSPACE / ACTUAL PACKAGED CLI RESULTS</text><g font-family="Consolas,Menlo,monospace" font-size="23">
<text x="52" y="106" fill="#c2ff8a" xml:space="preserve">PS&gt; cwm export ...</text>
<text x="52" y="140" fill="#b6c6b5" xml:space="preserve">{</text>
<text x="52" y="174" fill="#f5f8f3" xml:space="preserve">  "verification": { "status": "verified" }</text>
