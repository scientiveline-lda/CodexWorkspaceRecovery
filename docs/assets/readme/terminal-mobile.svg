<svg xmlns="http://www.w3.org/2000/svg" width="600" height="735" viewBox="0 0 600 735" role="img" aria-labelledby="title desc"><title id="title">An independently checked portable recovery</title><desc id="desc">Abbreviated commands and selected JSON from a real synthetic packaged run: export verified, import verified, deployed bytes match, project state equivalent. The source remained unchanged.</desc><rect x="1" y="1" width="598" height="733" rx="16" fill="#0b1110" stroke="#314232" /><path d="M1 59H599" stroke="#314232" /><g fill="#657b65"><circle cx="27" cy="31" r="4" /><circle cx="43" cy="31" r="4" /><circle cx="59" cy="31" r="4" /></g><text x="87" y="36" fill="#b6c6b5" font-family="Arial,Helvetica,sans-serif" font-size="15">Synthetic run / actual results</text><g font-family="Consolas,Menlo,monospace" font-size="23"><text x="27" y="106" fill="#c2ff8a" xml:space="preserve">PS&gt; cwm export ...</text><text x="27" y="140" fill="#b6c6b5" xml:space="preserve">{</text><text x="27" y="174" fill="#f5f8f3" xml:space="preserve">  "verification": {</text><text x="27" y="208" fill="#f5f8f3" xml:space="preserve">    "status": "verified"</text><text x="27" y="242" fill="#b6c6b5" xml:space="preserve">  }</text><text x="27" y="276" fill="#b6c6b5" xml:space="preserve">}</text><text x="27" y="310" fill="#b6c6b5" xml:space="preserve" /><text x="27" y="344" fill="#c2ff8a" xml:space="preserve">PS&gt; cwm import verify ...</text><text x="27" y="378" fill="#b6c6b5" xml:space="preserve">{</text><text x="27" y="412" fill="#f5f8f3" xml:space="preserve">  "status": "verified",</text><text x="27" y="446" fill="#f5f8f3" xml:space="preserve">  "deployed_bytes_match": true</text><text x="27" y="480" fill="#b6c6b5" xml:space="preserve">}</text><text x="27" y="514" fill="#b6c6b5" xml:space="preserve" /><text x="27" y="548" fill="#8fa48f" xml:space="preserve">project status (selected field)</text><text x="27" y="582" fill="#c2ff8a" xml:space="preserve">"equivalent_selected_state"</text></g><path d="M27 656H573" stroke="#314232" /><text x="27" y="686" fill="#c2ff8a" font-family="Arial,Helvetica,sans-serif" font-size="17">Source unchanged. Independent comparison passed.</text><text x="27" y="712" fill="#8fa48f" font-family="Arial,Helvetica,sans-serif" font-size="13">Commands abbreviated; selected fields only. Synthetic data.</text></svg>
