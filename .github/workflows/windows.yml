name: Windows recovery fixtures
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-recovery:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install --require-hashes -r requirements-win-py314.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tools/publication_audit.py
      - run: python tools/secret_scan.py --download
      - run: python tools/provision_dev_tools.py --download
      - run: python tools/provision_validation_inputs.py --download
      - name: Provision isolated hash-locked engineering tools
        run: |
          python -m venv .quality
          ./.quality/Scripts/python.exe -m pip install --require-hashes -r requirements-quality-win-py314.lock
          ./.quality/Scripts/python.exe -m pip install --require-hashes -r requirements-win-py314.lock
          ./.quality/Scripts/python.exe -m pip install --no-deps --no-build-isolation -e .
      - name: Audit pinned public dependencies
        shell: pwsh
        run: ./.quality/Scripts/python.exe tools/audit_dependencies.py --online --output "$env:RUNNER_TEMP/cwm-dependency-audit.json"
      - name: Freeze and audit candidate
        shell: pwsh
        run: python tools/validate_release.py --phase baseline --workspace "$env:RUNNER_TEMP/cwm-validation" --candidate "$env:RUNNER_TEMP/cwm-validation/candidate.json"
      - name: Required fixtures, no skips
        shell: pwsh
        run: python tools/validate_release.py --phase fixtures --workspace "$env:RUNNER_TEMP/cwm-validation" --candidate "$env:RUNNER_TEMP/cwm-validation/candidate.json"
      - name: Engineering Excellence
        shell: pwsh
        run: python tools/validate_release.py --phase engineering --workspace "$env:RUNNER_TEMP/cwm-validation" --candidate "$env:RUNNER_TEMP/cwm-validation/candidate.json" --dependency-audit "$env:RUNNER_TEMP/cwm-dependency-audit.json"
      - name: Package, privacy canaries and embedded-runtime recovery
        shell: pwsh
        run: python tools/validate_release.py --phase package --workspace "$env:RUNNER_TEMP/cwm-validation" --candidate "$env:RUNNER_TEMP/cwm-validation/candidate.json"
      - name: Packaged export/import independent acceptance
        shell: pwsh
        run: python tools/validate_release.py --phase acceptance --workspace "$env:RUNNER_TEMP/cwm-validation" --candidate "$env:RUNNER_TEMP/cwm-validation/candidate.json"
      - name: Real interruption safety
        shell: pwsh
        run: python tools/validate_release.py --phase faults --workspace "$env:RUNNER_TEMP/cwm-validation" --candidate "$env:RUNNER_TEMP/cwm-validation/candidate.json"
      - name: Technical decision
        shell: pwsh
        run: python tools/validate_release.py --phase report --workspace "$env:RUNNER_TEMP/cwm-validation" --candidate "$env:RUNNER_TEMP/cwm-validation/candidate.json"
      # Never upload raw validation evidence, archives or disposable keys.
